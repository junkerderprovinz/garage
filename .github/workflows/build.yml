# =============================================================================
# build.yml — Garage Docker Image Build & Push
#
# Triggers: push to main, workflow_dispatch. Output: multi-arch image
# (linux/amd64, linux/arm64) pushed to ghcr.io/junkerderprovinz/garage — and,
# once DOCKERHUB_USERNAME (variable) + DOCKERHUB_TOKEN (secret) are set
# together, mirrored to docker.io/<DOCKERHUB_USERNAME>/garage — tagged
# :latest and the pinned GARAGE_VERSION Dockerfile ARG.
#
# Component versions (Garage, garage-webui, s6-overlay) are pinned in the
# Dockerfile ARGs, tracked by Renovate — not resolved dynamically here.
# =============================================================================

name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image already exists for this tag'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'templates/**']

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/junkerderprovinz/garage
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pinned Garage version from Dockerfile
        id: ver
        run: |
          TAG=$(grep -m1 '^ARG GARAGE_VERSION=' Dockerfile | cut -d= -f2)
          if [ -z "${TAG}" ]; then echo "::error::Could not read GARAGE_VERSION from Dockerfile"; exit 1; fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_bare=${TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "Pinned Garage version: ${TAG}"

      - name: Check if image already exists
        id: check
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}:${TAG}"
          SKIP="false"
          FORCE="${{ github.event.inputs.force_rebuild }}"
          EVENT="${{ github.event_name }}"
          if [ "${EVENT}" = "push" ]; then
            SKIP="false"
          elif [ "${FORCE}" = "true" ]; then
            SKIP="false"
          elif docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists — skipping build."
            SKIP="true"
          fi
          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Compose image tags
        id: tags
        if: steps.check.outputs.skip != 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.ver.outputs.tag }}
          TAG_BARE: ${{ steps.ver.outputs.tag_bare }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${TAG}"
            echo "${IMAGE_NAME}:${TAG_BARE}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              DH="docker.io/${DOCKERHUB_USERNAME}/garage"
              echo "${DH}:latest"
              echo "${DH}:${TAG}"
              echo "${DH}:${TAG_BARE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Smoke-test gate (amd64): boot the built image and require Garage's
      # admin API /health AND garage-webui to answer before anything is
      # pushed. A green Docker build only proves the image *builds* — this
      # proves both s6 services actually come up.
      # ---------------------------------------------------------------------
      - name: Build amd64 image for smoke test
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: garage:smoke-amd64
          cache-from: type=gha

      - name: Smoke test — admin API and webui must come up
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run -d --name garage-smoke -p 3900:3900 -p 3909:3909 \
            -e ACCESS_KEY=smoketest -e SECRET_KEY=smoketestsecretsmoketestsecret \
            -e BUCKET=smoke \
            garage:smoke-amd64
          cleanup() { docker logs garage-smoke || true; docker rm -f garage-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ok=""
          for i in $(seq 1 60); do
            if docker exec garage-smoke curl -fsS http://127.0.0.1:3903/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::Garage admin API never became healthy"; exit 1; }
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3909 >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::garage-webui never became healthy"; exit 1; }
          echo "Smoke test passed."

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
