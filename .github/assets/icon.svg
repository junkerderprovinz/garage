<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Garage">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8873a"/>
      <stop offset="1" stop-color="#b85c1e"/>
    </linearGradient>
  </defs>

  <!-- warehouse tile -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#tile)"/>

  <!-- building body -->
  <rect x="96" y="216" width="320" height="188" rx="14" fill="#ffffff"/>

  <!-- pitched roof -->
  <path d="M76 232 L256 108 L436 232 Z" fill="#ffffff"/>

  <!-- garage door: three horizontal panel lines over a rounded opening -->
  <g fill="#b85c1e">
    <rect x="152" y="260" width="208" height="144" rx="10"/>
  </g>
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <line x1="152" y1="292" x2="360" y2="292"/>
    <line x1="152" y1="324" x2="360" y2="324"/>
    <line x1="152" y1="356" x2="360" y2="356"/>
  </g>
</svg>
